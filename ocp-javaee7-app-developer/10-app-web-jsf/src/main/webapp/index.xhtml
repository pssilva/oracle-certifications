<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view locale="#{facesContext.externalContext.requestLocale}">
    <h:head><title>#{msg['title']}</title></h:head>
    <h:body>
        <h1>#{msg['title']}</h1>
        <h:form id="form">
            <h:outputLabel for="name" value="#{msg['name']}"/>
            <h:inputText id="name" value="#{greetingBean.name}"/>
            <h:message for="name"/>
            <h:commandButton value="#{msg['send']}" action="#{greetingBean.submit}"/>
        </h:form>
    </h:body>
</f:view>
</html>
